<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель — Рецепты</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Jost:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=La+Belle+Aurore&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Jost', sans-serif;
            background: #f5f5f5;
            color: #333;
        }
        
        header {
            background: rgba(255, 251, 248, 0.95);
            border-bottom: 2px solid rgba(200, 180, 200, 0.3);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.8em;
            color: #7a8b7a;
        }
        
        .header-buttons {
            display: flex;
            gap: 15px;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Jost', sans-serif;
            font-size: 0.95em;
            text-decoration: none;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: #8b9b8b;
            color: white;
        }
        
        .btn-primary:hover {
            background: #7a8b7a;
        }
        
        .btn-secondary {
            background: white;
            color: #8b9b8b;
            border: 2px solid #8b9b8b;
        }
        
        .btn-secondary:hover {
            background: #8b9b8b;
            color: white;
        }
        
        .btn-danger {
            background: #d4796c;
            color: white;
        }
        
        .btn-danger:hover {
            background: #c45f54;
        }
        
        main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #ddd;
        }
        
        .tab-btn {
            padding: 12px 24px;
            background: none;
            border: none;
            cursor: pointer;
            font-family: 'Playfair Display', serif;
            font-size: 1.1em;
            color: #999;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }
        
        .tab-btn.active {
            color: #7a8b7a;
            border-bottom-color: #7a8b7a;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        /* Add Recipe Tab */
        .form-container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            max-width: 900px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #7a8b7a;
        }
        
        input[type="text"],
        input[type="number"],
        input[type="url"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 4px;
            font-family: 'Jost', sans-serif;
            font-size: 1em;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus,
        input[type="number"]:focus,
        input[type="url"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #8b9b8b;
        }
        
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .ingredients-group,
        .steps-group {
            margin-bottom: 20px;
        }
        
        .ingredient-item,
        .step-item {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
        }
        
        .ingredient-item input,
        .step-item input {
            flex: 1;
        }
        
        .btn-remove {
            background: #d4796c;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
        }
        
        .btn-remove:hover {
            background: #c45f54;
        }
        
        .btn-add {
            background: #8b9b8b;
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
        
        .btn-add:hover {
            background: #7a8b7a;
        }
        
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .checkbox-group input[type="checkbox"] {
            width: auto;
        }
        
        .form-buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }
        
        .form-buttons .btn {
            flex: 1;
            padding: 12px;
            font-size: 1em;
        }
        
        /* Preview Section */
        .preview-container {
            margin-top: 30px;
            margin-left: 30px;
        }
        
        .preview-label {
            font-family: 'Playfair Display', serif;
            font-size: 1.2em;
            color: #7a8b7a;
            margin-bottom: 15px;
        }
        
        /* Recipes List Tab */
        .recipes-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        
        .recipe-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-left: 4px solid #8b9b8b;
        }
        
        .recipe-card h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.2em;
            color: #7a8b7a;
            margin-bottom: 10px;
        }
        
        .recipe-card-meta {
            font-size: 0.9em;
            color: #999;
            margin-bottom: 15px;
        }
        
        .recipe-card-actions {
            display: flex;
            gap: 10px;
        }
        
        .recipe-card-actions .btn {
            flex: 1;
            padding: 8px 12px;
            font-size: 0.9em;
        }
        
        .filter-bar {
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .filter-bar select {
            padding: 8px 12px;
        }
        
        .search-box {
            padding: 8px 12px;
            border: 2px solid #ddd;
            border-radius: 4px;
            font-family: 'Jost', sans-serif;
            flex: 1;
            min-width: 200px;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        
        .empty-state-icon {
            font-size: 3em;
            margin-bottom: 15px;
        }
        
        .message {
            padding: 15px 20px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: none;
        }
        
        .message.success {
            background: #d4f1d4;
            color: #2d5e2d;
            display: block;
        }
        
        .message.error {
            background: #fdd4d0;
            color: #5e2d2d;
            display: block;
        }
        
        .spice-selector {
            display: flex;
            gap: 10px;
        }
        
        .spice-btn {
            padding: 8px 12px;
            border: 2px solid #ddd;
            background: white;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s;
        }
        
        .spice-btn.active {
            background: #8b9b8b;
            color: white;
            border-color: #8b9b8b;
        }
        
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }
            
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .recipes-list {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>✏️ Админ-панель</h1>
        <div class="header-buttons">
            <a href="book.html" class="btn btn-secondary">📖 Книга</a>
            <a href="index.html" class="btn btn-secondary">🏠 Главная</a>
            <button class="btn btn-primary" onclick="logout()">Выход</button>
        </div>
    </header>
    
    <main>
        <div id="message" class="message"></div>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('add')">Добавить рецепт</button>
            <button class="tab-btn" onclick="switchTab('list')">Список рецептов</button>
        </div>
        
        <!-- ADD RECIPE TAB -->
        <div id="add" class="tab-content active">
            <div class="form-container">
                <form id="recipeForm">
                    <div class="form-group">
                        <label for="name">Название рецепта *</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="category">Категория *</label>
                            <select id="category" name="category" required>
                                <option value="">Выбери категорию</option>
                                <option value="breakfast">🥐 Завтрак</option>
                                <option value="main">🍲 Основное</option>
                                <option value="dessert">🍰 Десерт</option>
                                <option value="salad">🥗 Салат</option>
                                <option value="beverage">🍵 Напиток</option>
                                <option value="other">🌿 Другое</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label for="time">Время приготовления (мин) *</label>
                            <input type="number" id="time" name="time" min="1" required>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="difficulty">Сложность *</label>
                            <select id="difficulty" name="difficulty" required>
                                <option value="">Выбери сложность</option>
                                <option value="★☆☆">★☆☆ Легко</option>
                                <option value="★★☆">★★☆ Средне</option>
                                <option value="★★★">★★★ Сложно</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label>Острота *</label>
                            <div class="spice-selector">
                                <button type="button" class="spice-btn" onclick="setSpice(0)">Не острая</button>
                                <button type="button" class="spice-btn" onclick="setSpice(1)">🔥</button>
                                <button type="button" class="spice-btn" onclick="setSpice(2)">🔥🔥</button>
                                <button type="button" class="spice-btn" onclick="setSpice(3)">🔥🔥🔥</button>
                            </div>
                            <input type="hidden" id="spiciness" name="spiciness" value="">
                        </div>
                    </div>
                    
                    <div class="ingredients-group">
                        <label>Ингредиенты *</label>
                        <div id="ingredientsList"></div>
                        <button type="button" class="btn-add" onclick="addIngredient()">+ Добавить ингредиент</button>
                    </div>
                    
                    <div class="steps-group">
                        <label>Шаги приготовления *</label>
                        <div id="stepsList"></div>
                        <button type="button" class="btn-add" onclick="addStep()">+ Добавить шаг</button>
                    </div>
                    
                    <div class="form-group">
                        <label for="additionalInfo">Дополнительная информация</label>
                        <textarea id="additionalInfo" name="additionalInfo" placeholder="Советы, варианты, способы добавления ингредиентов..."></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label for="photoUrl">URL фото</label>
                        <input type="url" id="photoUrl" name="photoUrl" placeholder="https://example.com/photo.jpg">
                    </div>
                    
                    <div class="form-group checkbox-group">
                        <input type="checkbox" id="isFavorite" name="isFavorite">
                        <label for="isFavorite" style="margin-bottom: 0;">💚 Люимый рецепт</label>
                    </div>
                    
                    <div class="form-buttons">
                        <button type="submit" class="btn btn-primary">Сохранить рецепт</button>
                        <button type="reset" class="btn btn-secondary">Очистить</button>
                    </div>
                </form>
            </div>
        </div>
        
        <!-- RECIPES LIST TAB -->
        <div id="list" class="tab-content">
            <div class="filter-bar">
                <select id="categoryFilter" onchange="filterRecipes()">
                    <option value="">Все категории</option>
                    <option value="breakfast">🥐 Завтрак</option>
                    <option value="main">🍲 Основное</option>
                    <option value="dessert">🍰 Десерт</option>
                    <option value="salad">🥗 Салат</option>
                    <option value="beverage">🍵 Напиток</option>
                    <option value="other">🌿 Другое</option>
                </select>
                <input type="text" class="search-box" id="searchBox" placeholder="Поиск по названию..." onkeyup="filterRecipes()">
            </div>
            
            <div id="recipesList" class="recipes-list">
                <div class="empty-state">
                    <div class="empty-state-icon">📖</div>
                    <p>Рецептов пока нет. Добавь первый рецепт!</p>
                </div>
            </div>
        </div>
    </main>
    
    <script type="module">
        import { initSupabase, getAllRecipes, addRecipe, updateRecipe, deleteRecipe } from './js/db.js';
        import { CATEGORIES, DIFFICULTIES } from './js/config.js';
        
        let currentSpice = 0;
        let editingId = null;
        let allRecipes = [];
        
        // Initialize
        document.addEventListener('DOMContentLoaded', async () => {
            // Check password
            if (!sessionStorage.getItem('adminAuthenticated')) {
                const password = prompt('Введи пароль для доступа к админ-панели:');
                if (password !== 'addnew') {
                    alert('Неверный пароль');
                    window.location.href = 'index.html';
                    return;
                }
                sessionStorage.setItem('adminAuthenticated', 'true');
            }
            
            try {
                await initSupabase();
                addIngredient();
                addStep();
                await loadRecipes();
            } catch (error) {
                console.error('Ошибка инициализации:', error);
                showMessage('Ошибка подключения к базе данных', 'error');
            }
        });
        
        // Form submission
        document.getElementById('recipeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const ingredients = Array.from(document.querySelectorAll('.ingredient-item input'))
                .map(el => el.value)
                .filter(val => val.trim());
            
            const steps = Array.from(document.querySelectorAll('.step-item input'))
                .map(el => el.value)
                .filter(val => val.trim());
            
            if (ingredients.length === 0) {
                showMessage('Добавь хотя бы один ингредиент', 'error');
                return;
            }
            
            if (steps.length === 0) {
                showMessage('Добавь хотя бы один шаг', 'error');
                return;
            }
            
            const recipe = {
                name: document.getElementById('name').value,
                category: document.getElementById('category').value,
                time_minutes: parseInt(document.getElementById('time').value),
                spiciness: currentSpice,
                difficulty: document.getElementById('difficulty').value,
                ingredients: ingredients,
                steps: steps,
                additional_info: document.getElementById('additionalInfo').value,
                photo_url: document.getElementById('photoUrl').value,
                is_favorite: document.getElementById('isFavorite').checked
            };
            
            try {
                if (editingId) {
                    await updateRecipe(editingId, recipe);
                    showMessage('Рецепт обновлён!', 'success');
                    editingId = null;
                } else {
                    await addRecipe(recipe);
                    showMessage('Рецепт добавлен!', 'success');
                }
                
                document.getElementById('recipeForm').reset();
                currentSpice = 0;
                updateSpiceButtons();
                await loadRecipes();
                
                setTimeout(() => {
                    switchTab('list');
                }, 1000);
            } catch (error) {
                console.error('Ошибка:', error);
                showMessage('Ошибка сохранения рецепта', 'error');
            }
        });
        
        window.addIngredient = function() {
            const list = document.getElementById('ingredientsList');
            const div = document.createElement('div');
            div.className = 'ingredient-item';
            div.innerHTML = `
                <input type="text" placeholder="Ингредиент">
                <button type="button" class="btn-remove" onclick="this.parentElement.remove()">✕</button>
            `;
            list.appendChild(div);
        };
        
        window.addStep = function() {
            const list = document.getElementById('stepsList');
            const number = list.children.length + 1;
            const div = document.createElement('div');
            div.className = 'step-item';
            div.innerHTML = `
                <input type="text" placeholder="Шаг ${number}...">
                <button type="button" class="btn-remove" onclick="this.parentElement.remove()">✕</button>
            `;
            list.appendChild(div);
        };
        
        window.setSpice = function(level) {
            currentSpice = level;
            document.getElementById('spiciness').value = level;
            updateSpiceButtons();
        };
        
        function updateSpiceButtons() {
            document.querySelectorAll('.spice-btn').forEach((btn, idx) => {
                btn.classList.toggle('active', idx === currentSpice);
            });
        }
        
        window.switchTab = function(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tab).classList.add('active');
            event.target.classList.add('active');
        };
        
        async function loadRecipes() {
            try {
                allRecipes = await getAllRecipes();
                displayRecipes(allRecipes);
            } catch (error) {
                console.error('Ошибка загрузки:', error);
                showMessage('Ошибка загрузки рецептов', 'error');
            }
        }
        
        function displayRecipes(recipes) {
            const list = document.getElementById('recipesList');
            
            if (recipes.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📖</div>
                        <p>Рецептов не найдено</p>
                    </div>
                `;
                return;
            }
            
            list.innerHTML = recipes.map(recipe => `
                <div class="recipe-card" style="border-left-color: ${CATEGORIES[recipe.category]?.color || '#8b9b8b'}">
                    <h3>${recipe.name}</h3>
                    <div class="recipe-card-meta">
                        <div>${CATEGORIES[recipe.category]?.emoji} ${CATEGORIES[recipe.category]?.name}</div>
                        <div>⏱️ ${recipe.time_minutes} мин | ${recipe.difficulty}</div>
                        <div>${'🔥'.repeat(recipe.spiciness)}</div>
                        ${recipe.is_favorite ? '<div>💚 Люимый</div>' : ''}
                    </div>
                    <div class="recipe-card-actions">
                        <button class="btn btn-secondary" onclick="editRecipe('${recipe.id}')">Редактировать</button>
                        <button class="btn btn-danger" onclick="deleteRecipeConfirm('${recipe.id}')">Удалить</button>
                    </div>
                </div>
            `).join('');
        }
        
        window.filterRecipes = function() {
            const category = document.getElementById('categoryFilter').value;
            const search = document.getElementById('searchBox').value.toLowerCase();
            
            const filtered = allRecipes.filter(recipe => {
                const matchCategory = !category || recipe.category === category;
                const matchSearch = !search || recipe.name.toLowerCase().includes(search);
                return matchCategory && matchSearch;
            });
            
            displayRecipes(filtered);
        };
        
        window.deleteRecipeConfirm = function(id) {
            if (confirm('Удалить этот рецепт?')) {
                deleteRecipeHandler(id);
            }
        };
        
        async function deleteRecipeHandler(id) {
            try {
                await deleteRecipe(id);
                showMessage('Рецепт удалён', 'success');
                await loadRecipes();
            } catch (error) {
                console.error('Ошибка удаления:', error);
                showMessage('Ошибка удаления рецепта', 'error');
            }
        }
        
        window.editRecipe = function(id) {
            alert('Редактирование будет добавлено в следующей версии');
        };
        
        window.logout = function() {
            sessionStorage.removeItem('adminAuthenticated');
            window.location.href = 'index.html';
        };
        
        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = `message ${type}`;
            setTimeout(() => {
                msg.className = 'message';
            }, 3000);
        }
    </script>
</body>
</html>
