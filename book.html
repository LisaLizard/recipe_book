<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Книга рецептов ящерицы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Jost:wght@300;400;500;600;700&family=La+Belle+Aurore&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/recipe-card.css">
</head>
<body class="page-book">
  <header class="site-header">
    <h1>🦎 Книга рецептов ящерицы</h1>
    <div class="header-right">
      <div class="download-buttons">
        <button class="icon-btn" id="download-pdf-btn" title="Скачать PDF">PDF</button>
        <button class="icon-btn" disabled title="EPUB · скоро">EPUB</button>
        <button class="icon-btn" disabled title="DOCX · скоро">DOCX</button>
      </div>
      <nav class="site-nav">
        <a href="index.html">Главная</a>
        <a href="admin.html" class="admin-link">Админка</a>
      </nav>
    </div>
  </header>

  <main class="book-layout">
    <p id="book-status"></p>

    <aside class="toc-sidebar">
      <h2>Содержание</h2>
      <div id="toc-categories"></div>
    </aside>

    <section class="book-viewer">
      <div class="viewer-stage">
        <button class="page-nav page-nav--prev" id="prev-page" aria-label="Предыдущая страница">‹</button>
        <div class="viewer-page" id="viewer-page"></div>
        <button class="page-nav page-nav--next" id="next-page" aria-label="Следующая страница">›</button>
      </div>
      <div class="page-indicator" id="page-indicator"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/recipe-card.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="js/book.js"></script>
  <script src="js/admin-gate-link.js"></script>
</body>
</html>
